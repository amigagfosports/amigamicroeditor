name: GFOS release candidate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test ./...
      - run: GFOS_VERSION=0.1.0-rc1 package/build-gfos.sh
      - run: release/GFOpenMicro-0.1.0-rc1-linux-amd64/micro -version
      - run: cd release && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: GFOpenMicro-0.1.0-rc1
          path: |
            release/*.tar.gz
            release/SHA256SUMS
