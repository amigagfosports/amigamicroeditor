on:
  workflow_dispatch:

name: Upstream compatibility (manual)

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: true

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build
      run: make build

    - name: Test
      run: make test
