name: Nightly builds
on:
  workflow_dispatch: # Allows manual trigger
jobs:
  nightly:
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
    - name: Setup
      uses: actions/setup-go@v7
      with:
        go-version: '1.24.x'
        cache: true

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: master
        fetch-depth: 0

    - name: Build
      run: tools/cross-compile.sh nightly

    - name: Tag
      uses: rickstaa/action-create-tag@v1
      with:
        tag: nightly
        force_push_tag: true
        message: "Pre-release nightly"

    - name: Publish
      uses: softprops/action-gh-release@v3
      with:
        name: nightly
        tag_name: nightly
        files: binaries/*
        prerelease: true
