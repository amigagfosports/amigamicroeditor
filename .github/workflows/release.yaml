name: Release builds
on:
  workflow_dispatch: # Allows manual trigger
  # push:
  #   tags:
  #     - 'v*.*.*' # automatically react on semantic versioned tags
jobs:
  release:
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 30
    steps:
    - name: Setup
      uses: actions/setup-go@v7
      with:
        go-version: '1.24.x'
        cache: true

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build
      run: tools/cross-compile.sh

    - name: Publish
      uses: softprops/action-gh-release@v3
      with:
        files: binaries/*
